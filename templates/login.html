<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airwise - Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;
background:radial-gradient(circle at 20% 20%,#cfe8e1,transparent 50%),radial-gradient(circle at 80% 80%,#e9d9b8,transparent 45%),#e8eeea;color:#16211f}
form{width:min(380px,92vw);background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:32px;box-shadow:0 20px 50px rgba(22,33,31,.12)}
h1{margin:0 0 4px;font-size:26px}p{margin:0 0 22px;color:#51625e}label{display:block;font-size:13px;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid #b9c7c2;border-radius:8px;font-size:15px;background:#fff}
input:focus{outline:2px solid #1f6f6b;border-color:transparent}button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:8px;background:#1f6f6b;color:#fff;font-size:15px;cursor:pointer}
button:hover{background:#17575a}.err{color:#b3261e;font-size:13px;margin-top:12px;min-height:16px}
</style></head><body>
<form method="post" id="f" novalidate>
<h1>Airwise</h1><p>Air quality warehouse and analytics</p>
<label for="u">Username</label><input id="u" name="username" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<button>Sign in</button><div class="err" id="e">{{ error or '' }}</div>
</form>
<script>
f.addEventListener('submit',ev=>{if(!u.value.trim()||p.value.length<4){ev.preventDefault();e.textContent='Enter your username and a password of at least 4 characters.'}})
</script></body></html>
